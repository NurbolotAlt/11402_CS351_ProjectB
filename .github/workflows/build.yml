name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [gcc, clang]
        exclude:
          # MSVC on Windows instead of gcc/clang
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang

    steps:
    - uses: actions/checkout@v3

    - name: Set up dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Set up dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake

    - name: Set up dependencies (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/setup-nasm@v1

    - name: Configure with CMake
      run: |
        cmake -B build -DCMAKE_CXX_STANDARD=17

    - name: Build with CMake
      run: |
        cmake --build build --config Release

    - name: Build with Make (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        make clean
        make

    - name: Verify executable
      run: |
        ls -la build/csvdb 2>/dev/null || ls -la csv_db 2>/dev/null || echo "Executable locations vary by OS"

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Install cppcheck
      run: sudo apt-get install -y cppcheck

    - name: Run cppcheck
      run: cppcheck --enable=all --error-exitcode=1 .

    - name: Check formatting (clang-format)
      run: |
        sudo apt-get install -y clang-format
        find . -name "*.cpp" -o -name "*.h" | xargs clang-format --dry-run -Werror
      continue-on-error: true
